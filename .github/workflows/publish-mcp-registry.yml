name: Publish to MCP Registry

# The registry accepts a version only once npm serves it, and npm makes a trusted-publishing
# release available some minutes after the release workflow uploads it. So this runs on its own,
# started once npm serves the version: gh workflow run publish-mcp-registry.yml -f version=1.5.3
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to list, without the v (e.g. 1.5.3)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: v${{ inputs.version }}

    - name: Set version in server.json
      env:
        VERSION: ${{ inputs.version }}
      run: |
        jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    - name: Publish to MCP Registry
      run: ./mcp-publisher publish
